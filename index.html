<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="ReservaHQ crea herramientas digitales para que los negocios puedan reservar, vender y crecer."
    />
    <meta property="og:title" content="ReservaHQ — herramientas para negocios que hacen más" />
    <meta
      property="og:description"
      content="Conocé los productos de ReservaHQ para organizar reservas, productos y operaciones."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://reservahq.org" />
    <link rel="icon" type="image/png" href="/reservahq-icon.png" />
    <title>ReservaHQ — herramientas para negocios que hacen más</title>
    <script>
      try {
        var t = localStorage.getItem('reservahq-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
